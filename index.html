    <!-- 🔥 CARGAR TODO CON TIMESTAMP PARA EVITAR CACHÉ 🔥 -->
    <script>
        // Forzar que todos los recursos se carguen con timestamp
        (function() {
            const ts = Date.now();
            
            // Reescribir links de CSS si los hubiera
            document.addEventListener('DOMContentLoaded', function() {
                // Agregar timestamp a todas las imágenes
                document.querySelectorAll('img[src]').forEach(img => {
                    if (!img.src.includes('data:')) {
                        const separator = img.src.includes('?') ? '&' : '?';
                        img.src = img.src.split('?')[0] + separator + 't=' + ts;
                    }
                });
            });
        })();
    </script>

    <script>
        // CONSTANTES
        const CARRITO_STORAGE_KEY = 'triplem_carrito';
        
        // Estado global
        let todosLosProductos = [];
        let familiasUnicas = [];
        let familiaActiva = null;
        let busquedaActiva = false;

        // Elementos DOM
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const mainTitle = document.getElementById('mainTitle');
        const subtitle = document.getElementById('subtitle');
        const backButtonContainer = document.getElementById('backButtonContainer');
        const backToFamiliesBtn = document.getElementById('backToFamiliesBtn');
        const refreshCacheBtn = document.getElementById('refreshCacheBtn');
        const refreshMessage = document.getElementById('refreshMessage');
        const searchResultsCount = document.getElementById('searchResultsCount');

        // --- Funciones de carrito ---
        function obtenerCarrito() {
            const carritoGuardado = localStorage.getItem(CARRITO_STORAGE_KEY);
            if (carritoGuardado) return JSON.parse(carritoGuardado);
            return { items: [] };
        }

        function guardarCarrito(carrito) {
            localStorage.setItem(CARRITO_STORAGE_KEY, JSON.stringify(carrito));
            actualizarContadorCarrito();
        }

        function actualizarContadorCarrito() {
            const carrito = obtenerCarrito();
            const totalItemsUnicos = carrito.items.length;
            const badge = document.getElementById('cartBadge');
            if (badge) {
                if (totalItemsUnicos > 0) {
                    badge.textContent = totalItemsUnicos > 99 ? '99+' : totalItemsUnicos;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        window.cambiarCantidad = function(id, delta) {
            const cantidadSpan = document.getElementById(`cantidad-${id}`);
            if (!cantidadSpan) return;
            let cantidadActual = parseInt(cantidadSpan.textContent);
            let nuevaCantidad = cantidadActual + delta;
            if (nuevaCantidad < 1) nuevaCantidad = 1;
            if (nuevaCantidad > 99) nuevaCantidad = 99;
            cantidadSpan.textContent = nuevaCantidad;
            if (!window.cantidadesProductos) window.cantidadesProductos = {};
            window.cantidadesProductos[id] = nuevaCantidad;
        }

        window.agregarAlCarrito = function(id) {
            let cantidad = 1;
            if (window.cantidadesProductos && window.cantidadesProductos[id]) {
                cantidad = window.cantidadesProductos[id];
            } else {
                const span = document.getElementById(`cantidad-${id}`);
                if (span) cantidad = parseInt(span.textContent);
            }
            
            const producto = todosLosProductos.find(p => p.id === id);
            if (!producto) return;
            
            const carrito = obtenerCarrito();
            const existingItem = carrito.items.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.cantidad += cantidad;
            } else {
                carrito.items.push({
                    id: id,
                    nombre: producto.nombre,
                    precio: producto.precio,
                    imagen: producto.imagen,
                    familia: producto.familia,
                    cantidad: cantidad
                });
            }
            
            guardarCarrito(carrito);
            alert(`✅ Agregado al carrito:\n${producto.nombre}\nCantidad: ${cantidad}\nPrecio: ${producto.precio}`);
            actualizarContadorCarrito();
        }

        // --- Renderizado de tarjetas de CATEGORÍA ---
        function renderFamilias(familiasFiltradas = null) {
            const familiasAMostrar = familiasFiltradas || familiasUnicas;
            if (!familiasAMostrar.length) {
                productsGrid.innerHTML = '<p class="text-center col-span-3 text-on-surface-variant">No se encontraron categorías</p>';
                return;
            }
            
            const familiasHTML = familiasAMostrar.map(familia => {
                const cantidadProductos = todosLosProductos.filter(p => p.familia === familia).length;
                const imagenPath = `img/${familia}.webp?t=${Date.now()}`;
                
                return `
                    <article class="family-card group bg-surface-container-low rounded-xl overflow-hidden transition-all duration-300 hover:shadow-2xl hover:shadow-primary/20" data-familia="${familia}">
                        <div class="relative aspect-[4/3] bg-gradient-to-br from-surface-container-high to-surface-container overflow-hidden flex items-center justify-center p-4">
                            <img src="${imagenPath}" 
                                 alt="${familia}" 
                                 class="family-image w-full h-full object-contain"
                                 onerror="this.onerror=null; this.parentElement.innerHTML = '<div class=\\'absolute inset-0 flex items-center justify-center bg-surface-container-high\\'><span class=\\'material-symbols-outlined fallback-icon\\'>category</span></div>';">
                        </div>
                        <div class="p-6 text-center">
                            <h3 class="font-headline text-2xl font-bold tracking-tight text-primary">${familia}</h3>
                            <p class="text-on-surface-variant mt-2 text-sm">${cantidadProductos} ${cantidadProductos === 1 ? 'producto' : 'productos'}</p>
                        </div>
                    </article>
                `;
            }).join('');
            
            productsGrid.innerHTML = familiasHTML;
            searchResultsCount.classList.add('hidden');
            
            document.querySelectorAll('.family-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const familia = card.getAttribute('data-familia');
                    if (familia) {
                        seleccionarFamilia(familia);
                    }
                });
            });
        }

        // --- Renderizado de PRODUCTOS ---
        function renderProductos(productos, titulo = null, mostrarBotonVolver = false) {
            if (!productos || productos.length === 0) {
                productsGrid.innerHTML = `<p class="text-center col-span-3 text-on-surface-variant">No se encontraron productos que coincidan con la búsqueda</p>`;
                searchResultsCount.textContent = '0 resultados';
                searchResultsCount.classList.remove('hidden');
                return;
            }
            
            productos.forEach(p => {
                if (!window.cantidadesProductos) window.cantidadesProductos = {};
                if (!window.cantidadesProductos[p.id]) window.cantidadesProductos[p.id] = 1;
            });
            
            searchResultsCount.textContent = `${productos.length} ${productos.length === 1 ? 'resultado' : 'resultados'}`;
            searchResultsCount.classList.remove('hidden');
            
            const timestamp = Date.now();
            const productosHTML = productos.map(p => `
                <article class="product-card group" data-id="${p.id}">
                    <div class="relative aspect-[4/5] bg-surface-container-low overflow-hidden p-4 mb-6 rounded-lg flex items-center justify-center">
                        <img alt="${p.nombre}" class="product-image w-full h-full object-contain group-hover:scale-105 transition-transform duration-700" src="${p.imagen}?t=${timestamp}" onerror="this.src='https://placehold.co/600x800?text=Triple+M'"/>
                    </div>
                    <div class="quantity-selector">
                        <button class="quantity-btn" onclick="cambiarCantidad(${p.id}, -1)">−</button>
                        <span class="quantity-value" id="cantidad-${p.id}">${window.cantidadesProductos[p.id]}</span>
                        <button class="quantity-btn" onclick="cambiarCantidad(${p.id}, 1)">+</button>
                    </div>
                    <div class="flex flex-col gap-2 mb-4">
                        <h3 class="font-headline text-xl font-bold tracking-tight text-on-surface">${p.nombre}</h3>
                        <p class="text-primary font-semibold text-lg">${p.precio}</p>
                        <p class="text-primary/70 font-semibold text-sm uppercase tracking-wide">${p.familia}</p>
                    </div>
                    <button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold uppercase tracking-widest text-xs hover:brightness-110 active:scale-95 transition-all" onclick="agregarAlCarrito(${p.id})">AGREGAR AL CARRITO</button>
                </article>
            `).join('');
            
            productsGrid.innerHTML = productosHTML;
            
            if (mostrarBotonVolver) {
                backButtonContainer.classList.remove('hidden');
            } else {
                backButtonContainer.classList.add('hidden');
            }
        }

        // --- Vista actual ---
        function actualizarVistaSegunEstado() {
            const busqueda = searchInput.value.trim().toLowerCase();
            
            if (busqueda !== '') {
                busquedaActiva = true;
                const productosFiltrados = todosLosProductos.filter(p => 
                    p.nombre.toLowerCase().includes(busqueda)
                );
                mainTitle.textContent = `Resultados para "${busqueda}"`;
                subtitle.textContent = `Encontramos ${productosFiltrados.length} ${productosFiltrados.length === 1 ? 'producto' : 'productos'}`;
                backButtonContainer.classList.add('hidden');
                renderProductos(productosFiltrados);
                return;
            }
            
            busquedaActiva = false;
            searchResultsCount.classList.add('hidden');
            
            if (familiaActiva === null) {
                mainTitle.textContent = "CATEGORIAS";
                subtitle.textContent = "Explora nuestras categorías";
                backButtonContainer.classList.add('hidden');
                renderFamilias();
            } else {
                mainTitle.textContent = familiaActiva;
                const productosFamilia = todosLosProductos.filter(p => p.familia === familiaActiva);
                subtitle.textContent = `Colección completa · ${productosFamilia.length} productos`;
                backButtonContainer.classList.remove('hidden');
                renderProductos(productosFamilia, null, true);
            }
        }

        function seleccionarFamilia(familia) {
            familiaActiva = familia;
            searchInput.value = '';
            actualizarVistaSegunEstado();
            window.history.pushState({ familia: familia }, '', window.location.href);
        }

        function volverAFamilias() {
            familiaActiva = null;
            searchInput.value = '';
            actualizarVistaSegunEstado();
            window.history.replaceState({ pagina: 'categorias' }, '', window.location.href);
        }

        function manejarBusqueda() {
            actualizarVistaSegunEstado();
        }

        // --- 🔥 FUNCIÓN REFRESH - RECARGA SIN CACHÉ 🔥 ---
        function recargarSinCache() {
            // Mostrar mensaje
            refreshMessage.classList.remove('hidden');
            const msgDiv = refreshMessage.querySelector('div');
            if (msgDiv) {
                msgDiv.innerHTML = '<span class="material-symbols-outlined text-sm spinner">sync</span><span>🔄 Recargando sin caché...</span>';
            }
            
            refreshCacheBtn.disabled = true;
            refreshCacheBtn.style.opacity = '0.5';
            
            // Limpiar storages
            try {
                localStorage.clear();
                sessionStorage.clear();
            } catch(e) {}
            
            // Limpiar caches del navegador
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
            
            // 🔥 RECARGAR FORZADO CON TIMESTAMP
            setTimeout(() => {
                const timestamp = Date.now();
                // Recargar la misma página con un parámetro único
                window.location.href = window.location.pathname + '?nocache=' + timestamp;
            }, 500);
        }

        // --- Cargar productos desde JSON ---
        async function cargarProductos() {
            try {
                const timestamp = Date.now();
                const url = `json/productos.json?nocache=${timestamp}`;
                
                const response = await fetch(url, {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    throw new Error('Formato JSON inválido: se esperaba un array');
                }
                
                todosLosProductos = data
                    .filter(item => item.precio_mayorista > 0)
                    .map(item => ({
                        id: item.codigo,
                        nombre: item.nombre,
                        precio: `$${item.precio_mayorista.toFixed(2)}`,
                        imagen: `img/${item.codigo}.webp`,
                        familia: item.categoria || "Sin categoría",
                        cantidad: 999
                    }));
                
                const familiasSet = new Set(todosLosProductos.map(p => p.familia).filter(f => f && f.trim()));
                familiasUnicas = Array.from(familiasSet).sort();
                
                window.todosLosProductos = todosLosProductos;
                window.cantidadesProductos = {};
                todosLosProductos.forEach(p => { window.cantidadesProductos[p.id] = 1; });
                
                familiaActiva = null;
                searchInput.value = '';
                actualizarVistaSegunEstado();
                actualizarContadorCarrito();
                
                return true;
            } catch (error) {
                console.error('Error cargando productos:', error);
                productsGrid.innerHTML = `<p class="text-center col-span-3 text-error">❌ Error al cargar productos: ${error.message}</p>`;
                return false;
            }
        }

        // --- Eventos ---
        window.addEventListener('popstate', function(event) {
            if (familiaActiva !== null) {
                volverAFamilias();
            } else {
                if (event.state && event.state.pagina === 'categorias') {
                    window.location.href = 'index.html';
                }
            }
        });

        window.history.replaceState({ pagina: 'categorias' }, '', window.location.href);

        searchInput.addEventListener('input', manejarBusqueda);
        backToFamiliesBtn.addEventListener('click', volverAFamilias);
        refreshCacheBtn.addEventListener('click', recargarSinCache);
        
        // Inicializar
        cargarProductos();
    </script>
</body>
</html>
